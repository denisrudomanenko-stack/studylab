server {
    listen 80;
    server_name study.24pensi.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name study.24pensi.ru;

    ssl_certificate     /etc/letsencrypt/live/study.24pensi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.24pensi.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    location / {
        proxy_pass         http://127.0.0.1:8201;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SSE: disable buffering so stream responses reach client immediately
    location ~ ^/api/(subjects/.+/chat/stream|subjects/.+/tickets/.+/generate) {
        proxy_pass         http://127.0.0.1:8201;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
